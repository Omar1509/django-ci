name: Build Django Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar tests (si tienes)
      run: |
        python manage.py test || echo "No hay tests definidos"

    - name: Construir imagen Docker
      run: |
        docker build -t django-crud-sqlite3 .

    - name: Guardar artefacto (simulado)
      run: echo "Imagen construida y lista para subir a DockerHub (simulado)"
